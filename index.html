<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#25473f"><title>michi — 散歩日記</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%2325473f' d='M32 4c16 14 23 27 23 37a23 23 0 1 1-46 0C9 31 16 18 32 4Z'/%3E%3Ccircle cx='32' cy='40' r='8' fill='%23f6f1e8'/%3E%3C/svg%3E">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+JP:wght@400;500;600;700&display=swap');
    :root{--ink:#25473f;--cream:#f6f1e8;--paper:#fffdf8;--coral:#e86e5a;--line:#dfd9ce;--muted:#77766f}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Sans JP',sans-serif}.app{max-width:510px;margin:auto;min-height:100vh;background:var(--paper);padding:20px 20px 104px}.top{display:flex;justify-content:space-between;align-items:center}.wordmark{font:32px 'DM Serif Display',serif;letter-spacing:-1px}.today{font-size:12px;color:var(--muted);text-align:right}.welcome{margin:32px 0 20px;font-size:21px;line-height:1.65;font-weight:500}.journey{background:var(--ink);border-radius:28px;padding:25px;color:#fff;position:relative;overflow:hidden}.journey:after{content:'';position:absolute;width:190px;height:190px;border:1px solid #90a59b;border-radius:50%;right:-65px;bottom:-92px}.eyebrow{font-size:12px;color:#b8c6be;letter-spacing:.1em}.distance{font:64px 'DM Serif Display',serif;line-height:1;margin:13px 0 5px}.place{position:relative;z-index:1;font-size:16px}.compass{height:145px;display:grid;place-items:center}.needle{width:64px;height:64px;background:var(--coral);clip-path:polygon(50% 0,67% 52%,50% 100%,33% 52%);transform:rotate(25deg);filter:drop-shadow(0 5px 8px #132c26)}.hint{color:#c7d2cc;font-size:12px;text-align:center}.section{margin-top:32px}.section h2{font:22px 'DM Serif Display',serif;margin:0 0 14px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:white;border-radius:99px;padding:10px 14px;color:var(--ink);font:14px inherit}.chip.active{background:#dce9df;border-color:#87a898}.length{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.length button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 7px;font:13px inherit;color:var(--ink)}.length button.active{border-color:var(--ink);background:var(--ink);color:white}.start{width:100%;margin-top:25px;border:0;border-radius:16px;padding:17px;background:var(--coral);color:white;font:600 16px inherit;box-shadow:0 7px 18px #e86e5a55}.log{margin-top:35px;border-top:1px solid var(--line);padding-top:22px}.log-header{display:flex;justify-content:space-between;align-items:center}.log-header h2{margin:0}.count{font-size:12px;color:var(--muted)}.entry{display:flex;gap:13px;margin-top:15px}.thumb{width:58px;height:58px;flex:none;border-radius:12px;background:linear-gradient(135deg,#f3b269,#d7795f);display:grid;place-items:center;font-size:24px}.entry-title{font-size:14px;font-weight:600;margin:4px 0}.entry-meta{font-size:12px;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;margin:auto;max-width:510px;background:#fffdf8ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:12px 12px 18px}.nav{border:0;background:transparent;color:var(--muted);font:12px inherit;display:grid;gap:3px;place-items:center}.nav.active{color:var(--ink);font-weight:700}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:82px;background:#25473f;color:white;padding:12px 17px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;white-space:nowrap}.toast.show{opacity:1}@media(min-width:511px){body{padding:20px}.app{border-radius:30px;box-shadow:0 12px 40px #25473f16}}
  </style>
</head>
<body><main class="app"><header class="top"><div class="wordmark">michi</div><div class="today">2026.09.30<br>Wednesday</div></header><p class="welcome">今日は、どんな景色に<br>出会いにいこう。</p>
<section class="journey"><div class="eyebrow">きょうの行き先</div><div class="distance" id="distance">1.2 km</div><div class="place" id="destination">まだ名前のない場所</div><div class="compass"><div class="needle" id="needle"></div></div><div class="hint" id="hint">現在地を読み込むと、方角がわかります</div></section>
<section class="section"><h2>どんな散歩にする？</h2><div class="chips" id="genres"><button class="chip active">おまかせ</button><button class="chip">ひと息</button><button class="chip">街の発見</button><button class="chip">緑を歩く</button><button class="chip">写真散歩</button></div></section>
<section class="section"><h2>歩く時間</h2><div class="length" id="length"><button class="active" data-km="1.2">15分<br><small>約1 km</small></button><button data-km="2.5">30分<br><small>約2–3 km</small></button><button data-km="5.0">1時間<br><small>約5 km</small></button></div><button class="start" id="start">この散歩をはじめる</button></section>
<section class="log"><div class="log-header"><h2>散歩の余白</h2><span class="count" id="count">0 entries</span></div><div id="entries"><div class="entry"><div class="thumb">☕</div><div><div class="entry-title">散歩をはじめてみよう</div><div class="entry-meta">写真とひとことが、ここに並びます</div></div></div></div></section>
</main><nav class="bottom"><button class="nav active">◉<span>さんぽ</span></button><button class="nav" id="save">✦<span>記録する</span></button><button class="nav">▦<span>日記</span></button></nav><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let km=1.2,genre='おまかせ',coords=null,bearing=null,heading=0,target=null,targetName='',arrivalHandled=false;const store=JSON.parse(localStorage.getItem('michi-log')||'[]'),visited=JSON.parse(localStorage.getItem('michi-visited')||'[]');
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2300)}
function render(){ $('#count').textContent=`${store.length} entries`;if(!store.length)return;$('#entries').innerHTML=store.map(x=>`<div class="entry"><div class="thumb">${x.icon}</div><div><div class="entry-title">${x.title}</div><div class="entry-meta">${x.date} ・ ${x.genre} ・ ${x.distance}</div></div></div>`).join('') }
$('#genres').addEventListener('click',e=>{if(!e.target.matches('button'))return;$$('#genres button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');genre=e.target.textContent;});
$('#length').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$$('#length button').forEach(x=>x.classList.remove('active'));b.classList.add('active');km=+b.dataset.km;$('#distance').textContent=`${km} km`;});
function pointFrom(lat,lon,km,b){const r=6371,d=km/r,a=b*Math.PI/180,p=lat*Math.PI/180,l=lon*Math.PI/180;return [Math.asin(Math.sin(p)*Math.cos(d)+Math.cos(p)*Math.sin(d)*Math.cos(a))*180/Math.PI,(l+Math.atan2(Math.sin(a)*Math.sin(d)*Math.cos(p),Math.cos(d)-Math.sin(p)*Math.sin(Math.asin(Math.sin(p)*Math.cos(d)+Math.cos(p)*Math.sin(d)*Math.cos(a)))))*180/Math.PI]}
function kmBetween(a,b){const r=6371,p=Math.PI/180,dLat=(b[0]-a[0])*p,dLon=(b[1]-a[1])*p,x=Math.sin(dLat/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(dLon/2)**2;return 2*r*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function complete(){if(arrivalHandled||!target)return;arrivalHandled=true;visited.push({point:target,date:new Date().toISOString(),genre,name:targetName});localStorage.setItem('michi-visited',JSON.stringify(visited));$('#destination').textContent=targetName||'今日の場所に、到着しました';$('#hint').textContent='到着しました。この場所は、次から候補に入りません。';toast('到着を記録しました。おつかれさま。')}
function pointNeedle(){if(bearing!==null)$('#needle').style.transform=`rotate(${bearing-heading}deg)`}
window.addEventListener('deviceorientation',e=>{heading=e.webkitCompassHeading??e.alpha??heading;pointNeedle()});
const queries={"ひと息":"[amenity~'cafe|bench'][access!~'private'](around:R,LAT,LON);nwr[leisure~'park|garden'][access!~'private'](around:R,LAT,LON);","街の発見":"nwr[historic][name][access!~'private'](around:R,LAT,LON);nwr[amenity~'place_of_worship|arts_centre|library'][name][access!~'private'](around:R,LAT,LON);","緑を歩く":"nwr[leisure~'park|garden'][name][access!~'private'](around:R,LAT,LON);nwr[natural][name][access!~'private'](around:R,LAT,LON);","写真散歩":"nwr[tourism~'viewpoint|artwork'][name][access!~'private'](around:R,LAT,LON);nwr[historic][name][access!~'private'](around:R,LAT,LON);"};
async function chooseSpot(p){const all=Object.values(queries).join('');const body=(genre==='おまかせ'?all:queries[genre]).replaceAll('R',Math.max(2500,km*1600)).replaceAll('LAT',p.coords.latitude).replaceAll('LON',p.coords.longitude);const res=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent('[out:json][timeout:20];('+body+');out center tags;')});if(!res.ok)throw Error();const list=(await res.json()).elements.map(x=>({point:[x.lat??x.center?.lat,x.lon??x.center?.lon],name:x.tags?.name})).filter(x=>x.name&&x.point.every(Number.isFinite));const desired=list.filter(x=>{const d=kmBetween([p.coords.latitude,p.coords.longitude],x.point);return d>=Math.max(.2,km*.45)&&d<=km*1.8&&!visited.some(v=>kmBetween(x.point,v.point)<.02)});return (desired.length?desired:list.filter(x=>!visited.some(v=>kmBetween(x.point,v.point)<.02)))[Math.floor(Math.random()*(desired.length?desired.length:list.length))]}
async function begin(){const labels={"おまかせ":"今日の秘密の場所","ひと息":"風の通るひと休み","街の発見":"まだ知らない角の先","緑を歩く":"木漏れ日の小径","写真散歩":"光を見つける場所"};$('#destination').textContent=labels[genre];$('#hint').textContent='近くの公開スポットを探しています…';arrivalHandled=false;$('#start').disabled=true;if(!navigator.geolocation){toast('この端末では位置情報が使えません');return}navigator.geolocation.getCurrentPosition(async p=>{try{coords=p.coords;const spot=await chooseSpot(p);if(!spot)throw Error();target=spot.point;targetName=spot.name;bearing=Math.atan2(Math.sin((target[1]-p.coords.longitude)*Math.PI/180)*Math.cos(target[0]*Math.PI/180),Math.cos(p.coords.latitude*Math.PI/180)*Math.sin(target[0]*Math.PI/180)-Math.sin(p.coords.latitude*Math.PI/180)*Math.cos(target[0]*Math.PI/180)*Math.cos((target[1]-p.coords.longitude)*Math.PI/180))*180/Math.PI;localStorage.setItem('michi-destination',JSON.stringify({target,bearing,km,genre}));$('#hint').textContent='公開スポットを見つけました。矢印をたよりに進もう。';pointNeedle();navigator.geolocation.watchPosition(q=>{if(kmBetween([q.coords.latitude,q.coords.longitude],target)<=.075)complete()},null,{enableHighAccuracy:true,maximumAge:5000});toast('行き先を決めました。よい散歩を。')}catch{toast('近くのスポットが見つかりませんでした。もう一度試してみてください');$('#hint').textContent='通信を確認して、もう一度試してください。'}finally{$('#start').disabled=false}},()=>{toast('位置情報を許可すると目的地を探せます');$('#start').disabled=false},{enableHighAccuracy:true})}
$('#start').onclick=begin;$('#save').onclick=()=>{const note=prompt('今日見つけたものを、ひとことで。');if(note===null)return;store.unshift({title:note||'今日の散歩',date:new Date().toLocaleDateString('ja-JP'),genre,distance:km+' km',icon:['☕','🌿','📷','🪟'][Math.floor(Math.random()*4)]});localStorage.setItem('michi-log',JSON.stringify(store));render();toast('散歩日記に保存しました')};render();
</script></body></html>
