<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#25473f"><meta name="description" content="まだ知らない街へ。秘密の目的地と散歩の日記。"><title>michi — 散歩日記</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css">
</head><body><main class="app"><header class="top"><div class="wordmark">michi</div><div class="today" id="today"></div></header>
<div id="walk-view"><p class="welcome">今日は、どんな景色に<br>出会いにいこう。</p>
<section class="journey" aria-label="散歩ナビ"><div class="eyebrow" id="phase">きょうの行き先</div><div class="distance" id="distance">—</div><div class="place" id="destination">まだ名前のない場所</div><div class="compass"><div class="needle unavailable" id="needle" role="img" aria-label="方位未取得"></div></div><div class="hint" id="hint">ジャンルと距離を選んではじめましょう</div></section>
<p id="gps" class="status" role="status"></p><p id="message" class="status" role="status"></p>
<div class="actions"><button id="compass">コンパスを有効にする</button><button id="resume" hidden>散歩を再開</button><button id="pause" hidden>一時停止</button><button id="skip" hidden>この場所をスキップ</button><button id="finish" hidden>散歩を終了</button><a id="map" hidden target="_blank" rel="noopener noreferrer">行き先を地図で確認</a></div>
<div id="setup"><section class="section"><h2>どんな散歩にする？</h2><div class="chips" id="genres"><button class="chip active" aria-pressed="true">おまかせ</button><button class="chip" aria-pressed="false">ひと息</button><button class="chip" aria-pressed="false">街の発見</button><button class="chip" aria-pressed="false">緑を歩く</button><button class="chip" aria-pressed="false">写真散歩</button></div></section>
<section class="section"><h2>目的地までの距離</h2><div class="length" id="length"><button class="active" data-km="1.2" aria-pressed="true">近くへ<br><small>〜1.2 km</small></button><button data-km="2.5" aria-pressed="false">少し先へ<br><small>〜2.5 km</small></button><button data-km="5" aria-pressed="false">遠くへ<br><small>〜5 km</small></button></div><button class="start" id="start">この散歩をはじめる</button></section></div>
<p class="fine">表示は目的地への直線距離・方角です。歩ける道順ではありません。営業時間・立入可否は現地で確認し、入れない場所はスキップしてください。</p>
<p class="fine">検索時は現在地をスポット検索サービスに送信します。日記と訪問履歴はこのブラウザに保存します。</p></div>
<section class="log" id="diary-view" hidden><div class="log-header"><h2>散歩の余白</h2><span class="count" id="count"></span></div><div id="entries"></div><div class="actions"><button id="export">日記・履歴をバックアップ</button></div></section>
<footer><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap contributors</a><p id="offline" class="fine">michi 0.2 · 日記はこの端末に保存</p><button id="install" class="chip" hidden>ホーム画面に追加</button></footer>
</main><nav class="bottom" aria-label="画面切替"><button class="nav active" id="walk-tab">◉<span>さんぽ</span></button><button class="nav" id="save">✦<span>記録する</span></button><button class="nav" id="diary-tab">▦<span>日記</span></button></nav>
<dialog id="editor"><form id="note-form"><h2>今日のひとこと</h2><label for="note">見つけた景色、気になったこと</label><textarea id="note" maxlength="2000" required></textarea><div class="actions"><button type="button" id="cancel-note">閉じる</button><button type="submit">保存する</button></div></form></dialog>
<div class="toast" id="toast" role="status"></div><script type="module" src="./app.mjs"></script></body></html>
