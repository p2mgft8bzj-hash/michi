<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#25473f"><meta name="description" content="地図で選ぶ行き先と、日々の散歩日記。"><title>michi — 散歩日記</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./maplibre-gl.css"><link rel="stylesheet" href="./style.css">
</head><body><main class="app"><header class="top"><div class="wordmark">michi</div><div class="today" id="today"></div></header>
<div id="walk-view"><p class="welcome">今日は、どこを歩こう。</p>
<section class="map-journey" aria-label="散歩マップ"><div class="map-heading"><div class="eyebrow" id="phase">WALK</div><h1 id="destination">今日の行き先</h1></div><div id="walk-map" role="region" aria-label="現在地と目的地の地図"><div id="map-placeholder">現在地を表示するか、散歩をはじめましょう。</div></div><div class="map-legend"><span><i class="current-dot"></i>現在地</span><span><i class="secret-dot">?</i>目的地</span></div><button id="map-retry" class="chip" hidden>地図を再読み込み</button><p id="map-status" class="status" role="status"></p><p class="hint" id="hint"></p></section>
<p id="gps" class="status" role="status"></p><p id="message" class="status" role="status"></p>
<div class="actions map-actions"><button id="locate">現在地を表示</button><button id="overview" hidden>全体を見る</button><button id="resume" hidden>散歩を再開</button><button id="pause" hidden>一時停止</button><button id="skip" hidden>行き先を変える</button><button id="finish" class="secondary" hidden>散歩を終了</button></div>
<div class="actions"><button id="cancel-search" hidden>検索をキャンセル</button></div><div id="setup"><section class="section"><h2>どんな散歩にする？</h2><div class="chips" id="genres"><button class="chip active" aria-pressed="true">おまかせ</button><button class="chip" aria-pressed="false">ひと息</button><button class="chip" aria-pressed="false">街の発見</button><button class="chip" aria-pressed="false">緑を歩く</button><button class="chip" aria-pressed="false">写真散歩</button></div></section>
<section class="section"><h2>探す範囲</h2><div class="length" id="length"><button class="active" data-km="1.2" aria-pressed="true">近くへ<br><small>〜1.2 km</small></button><button data-km="2.5" aria-pressed="false">少し先へ<br><small>〜2.5 km</small></button><button data-km="5" aria-pressed="false">遠くへ<br><small>〜5 km</small></button></div><button class="start" id="start">行き先を探す</button></section></div>
<details class="help"><summary>地図と保存について</summary><p class="fine">表示は日本国内の地図です。橋や道を確認して歩いてください。徒歩ルートは表示しません。検索範囲は直線距離です。</p><p class="fine">日記・訪問履歴はこのブラウザに保存します。検索サービスに現在地を、地図配信サービスに表示範囲を送信します。地図の表示には通信が必要です。</p></details></div>
<section class="log" id="diary-view" hidden><div class="log-header"><h2>散歩日記</h2><span class="count" id="count"></span></div><div id="entries"></div><div class="actions"><button id="export">日記・履歴をバックアップ</button></div></section>
<footer><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap contributors</a><p id="offline" class="fine">michi 0.4 · 日記はこの端末に保存</p><button id="install" class="chip" hidden>ホーム画面に追加</button></footer>
</main><nav class="bottom" aria-label="画面切替"><button class="nav active" id="walk-tab">◉<span>さんぽ</span></button><button class="nav" id="save">✦<span>記録する</span></button><button class="nav" id="diary-tab">▦<span>日記</span></button></nav>
<dialog id="editor"><form id="note-form"><h2 id="editor-title">日記を書く</h2><label for="note">見つけた景色、気になったこと</label><textarea id="note" maxlength="2000" required placeholder="今日の散歩で気づいたこと"></textarea><div class="actions"><button type="button" id="cancel-note">閉じる</button><button type="submit">保存する</button></div></form></dialog>
<div class="toast" id="toast" role="status"></div><script src="./maplibre-gl.js"></script><script src="./pmtiles.js"></script><script type="module" src="./app.mjs"></script></body></html>
